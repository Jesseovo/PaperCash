<svg xmlns="http://www.w3.org/2000/svg" width="780" height="128" viewBox="0 0 780 128" role="img" aria-labelledby="title desc"><title id="title">Open your little research desk</title><desc id="desc">发现真实论文、收藏书签、复制引用，或交给 Agent 深入研究。</desc><rect x=".5" y=".5" width="779" height="127" rx="6" fill="#161e1a" stroke="#35453a"/><g transform="translate(29 20) scale(1.7)"><g shape-rendering="crispEdges"><path d="M2 15h5v-2h10v2h4v2h2v16h-4v-2H7v-2H2zM44 15h-5v-2H29v2h-4v2h-2v16h4v-2h12v-2h5z" fill="#8da4b1"/><path d="M6 16h10v2h4v12h-4v-2H6zM40 16H30v2h-4v12h4v-2h10z" fill="#eee7d5"/><path d="M9 19h7v2H9zM9 23h8v2H9zM30 19h7v2h-7zM29 23h8v2h-8z" fill="#b6a99a"/><path d="M32 27h4v10h-2v-2h-2z" fill="#98ad90"/></g></g><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif"><text x="137" y="35" font-family="Consolas,monospace" font-size="10" letter-spacing="1.7" fill="#9faea5">PAPERCASH / THE READING DESK</text><text x="137" y="69" font-size="22" fill="#d6e2d5">给好奇心，留一张书桌。</text><text x="137" y="97" font-size="12" fill="#9faea5">发现论文 · 收藏书签 · 复制引用 · 交给 Agent</text><text x="610" y="68" font-size="13" fill="#abc5a2">打开书桌 ↗</text></g><path d="M735 21h3v6h6v3h-6v6h-3v-6h-6v-3h6z" fill="#35453a"/></svg>
